{% extends "base.html" %}
{% block title %}高潜大客转化预测{% endblock %}
{% block content %}
<div class="header">
    <div class="header-left">
        <h2>🎯 高潜大客转化预测 (Logistic Regression)</h2>
        <span class="header-subtitle">基于多维行为特征识别具备大额打赏潜力的普通用户</span>
    </div>
</div>

<div class="card">
    <table class="table" id="whale-table">
        <thead>
            <tr>
                <th>用户</th>
                <th>场次参与</th>
                <th>累计消费</th>
                <th>场均消费</th>
                <th>预测大客概率</th>
                <th>状态</th>
            </tr>
        </thead>
        <tbody id="whale-tbody">
            <tr><td colspan="6" style="text-align:center;">正在计算模型...</td></tr>
        </tbody>
    </table>
</div>

<script>
fetch('/api/predict/whale-prob')
    .then(r => r.json())
    .then(d => {
        const tbody = document.getElementById('whale-tbody');
        tbody.innerHTML = '';
        (d.users || []).forEach(u => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><a href="/user?uid=${u.user_id}"><b>${u.user_name}</b></a></td>
                <td>${u.session_count}</td>
                <td>${u.total_consume.toLocaleString()}</td>
                <td>${u.avg_consume.toLocaleString()}</td>
                <td><span class="badge ${u.whale_probability > 0.7 ? 'badge-danger' : 'badge-primary'}">${(u.whale_probability * 100).toFixed(1)}%</span></td>
                <td>${u.is_whale ? '<span style="color:#10b981;">已是大客</span>' : '<span style="color:#f59e0b;">高潜线索</span>'}</td>
            `;
            tbody.appendChild(tr);
        });
    });
</script>
{% endblock %}
